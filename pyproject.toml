[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-sentinel"
version = "0.9.7"
description = "AI trading terminal — Hyperliquid, Aster DEX, CoinGecko, Yahoo Finance, FRED, quant analysis"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [
    {name = "Sentinel Labs", email = "dev@hyper-sentinel.com"},
]
keywords = ["crypto", "trading", "ai", "defi", "hyperliquid", "aster", "sentinel", "agent", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.0",
    "rich>=13.0",
    "yfinance>=0.2.36",
    "pandas>=2.0",
    "requests>=2.31",
    "hyperliquid-python-sdk>=0.4.0",
    "tweepy>=4.14",
    "pandas-ta>=0.3.14b1",
    "statsmodels>=0.14",
    "arch>=7.0",
    "scikit-learn>=1.4",
    # v0.9.2: required by Aster DEX scraper (aster.py); was present in the dev
    # sandbox (hyper-sentinel/pyproject.toml) but missing from the shipped SDK.
    "tenacity>=8.2.0",
    # v0.9.2: required by Y2 news/intelligence scraper (scrapers/y2.py).
    # Was present in sandbox pyproject.toml but missing from the shipped SDK.
    "y2-py>=0.4.1",
]

[project.scripts]
sentinel = "sentinel.cli:cli"

[project.optional-dependencies]
vault = ["cryptography>=42.0"]
async = ["httpx[http2]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "build", "twine"]

[project.urls]
Homepage = "https://hyper-sentinel.com"
Documentation = "https://hyper-sentinel.com/docs"
"API Reference" = "https://api.hyper-sentinel.com/docs"
Repository = "https://github.com/hyper-sentinel/hyper-sentinel-sdk"
Issues = "https://github.com/hyper-sentinel/hyper-sentinel-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel", "sentinel.api", "sentinel.api.resources", "sentinel.scrapers", "hyper_sentinel"]

[tool.pytest.ini_options]
markers = [
    "integration: hits live Cloud Run API (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "build>=1.4.2",
    "twine>=6.2.0",
]
